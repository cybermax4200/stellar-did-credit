packages:
  # Covers packages/sdk, packages/feeder, and packages/issuer-example.
  # All three packages are resolved when running `pnpm install` from the repo root.
  - 'packages/*'

# Security overrides: force patched versions of vulnerable transitive dependencies.
overrides:
  "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "toml": "4.2.0"
  "markdown-it@<14.3.1": "14.3.1"
  "axios": "1.20.0"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "handlebars": "4.7.10"
